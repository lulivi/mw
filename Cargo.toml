[package]
name = "mw"
description = "Music Wrapped: your listening recap from your Spotify and YouTube Music data"
version = "0.2.0"
edition = "2024"
publish = false
exclude = ["data/"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
glob = "0.3.4"
resvg = "0.49.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
ttf-parser = "0.25.1"
unicode-normalization = "0.1.26"
ureq = { version = "3.5.1", features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "mw"
path = "src/main.rs"

[profile.release]
opt-level = 3
