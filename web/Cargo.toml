[package]
name = "mw-web"
description = "The mw web page: the library compiled to WebAssembly"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
mw = { path = "..", default-features = false }
serde_json = "1.0.154"
# Pinned: scripts/web.sh runs wasm-bindgen-cli of the same version.
wasm-bindgen = "=0.2.130"
